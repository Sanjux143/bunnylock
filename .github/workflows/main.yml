name: Build bunnylock APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # Ubuntu 26.04 की चेतावनी से बचने के लिए इसे 24.04 पर फिक्स किया गया है
    runs-on: ubuntu-24.04 
    steps:
      - name: Checkout code
        uses: actions/checkout@v6 # Node 20 की चेतावनी खत्म करने के लिए v6 किया गया

      - name: Set up JDK 17
        uses: actions/setup-java@v5 # v4 deprecated था, इसलिए v5 किया गया
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3 

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK (unsigned)
        if: startsWith(github.ref, 'refs/tags/')
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bunnylock-debug
          path: app/build/outputs/apk/debug/app-debug.apk
