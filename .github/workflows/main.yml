name: Build bunnylock APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04 
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: '' 

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1. टेक्स्ट फाइल से .jks फाइल वापस बनाना
      - name: Decode Keystore
        run: |
          base64 -d keystore_base64.txt > app/release.jks

      # 2. आपकी Key और पासवर्ड का इस्तेमाल करके Release APK बनाना
      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.jks \
            -Pandroid.injected.signing.store.password=123456 \
            -Pandroid.injected.signing.key.alias=key0 \
            -Pandroid.injected.signing.key.password=123456

      # 3. APK को डाउनलोड के लिए अपलोड करना
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: bunnylock-release-signed
          path: app/build/outputs/apk/release/app-release.apk
